services:
  gemma:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: rag-gemma
    volumes:
      - ${MODELS_FOLDER:-./models}:/models:ro
    command: >
      --model /models/${GEMMA_MODEL_FILE:-gemma.gguf}
      --host 0.0.0.0
      --port 8080
      --ctx-size 8192
      --n-predict 2048
      --threads 4
    ports:
      - "8080:8080"
    networks:
      - rag-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  neo4j:
    image: neo4j:5.18
    container_name: rag-neo4j
    environment:
      NEO4J_AUTH: neo4j/rag_password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - rag-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: rag-api
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: rag_password
      GEMMA_BASE_URL: http://gemma:8080
      DOCS_PATH: /docs
      CHUNK_SIZE: "1000"
      CHUNK_OVERLAP: "200"
      EMBED_MODEL: all-MiniLM-L6-v2
    volumes:
      - ./api:/app
      - embed_cache:/root/.cache/huggingface
      # Mount your local documents folder:
      - ${DOCS_FOLDER:-./sample-docs}:/docs:ro
    ports:
      - "8000:8000"
    networks:
      - rag-net
    depends_on:
      neo4j:
        condition: service_healthy
      gemma:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: rag-ui
    ports:
      - "3000:80"
    networks:
      - rag-net
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  embed_cache:

networks:
  rag-net:
    driver: bridge
